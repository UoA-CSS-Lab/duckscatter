on:
  push:
    branches:
      - development
    tags:
      - v*
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_CONFIG_REGISTRY: https://npm.flatt.tech/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Takumi Guard (npm)
        uses: flatt-security/setup-takumi-guard-npm@v1
      - name: Verify npm registry is Takumi Guard
        run: |
          actual="$(npm config get registry)"
          echo "registry=$actual"
          if [ "$actual" != "https://npm.flatt.tech/" ]; then
            echo "::error::npm is not routed through Takumi Guard (registry=$actual)"
            exit 1
          fi
      - uses: actions/cache@v6
        with:
          path: "**/node_modules"
          key: ${{ hashFiles('package-lock.json', 'examples/react/package-lock.json') }}
      - run: npm install
      - run: npm install --prefix examples/react
      - name: build
        run: npm run build
      - name: Verify build output ships in the npm tarball
        run: node .github/scripts/check-package-files.mjs
      - name: Build React example
        run: npm run build --prefix examples/react
      - name: lint
        run: npm run lint:all
      - name: test
        run: npm run test
      - uses: actions/cache/save@v6
        with:
          path: dist
          key: dist-${{ github.sha }}

  publish:
    runs-on: ubuntu-slim
    needs:
      - ci
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        registry-url:
          - https://npm.pkg.github.com
          - https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ matrix.registry-url == 'https://npm.pkg.github.com' }}
        with:
          node-version: 24
          registry-url: ${{ matrix.registry-url }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        if: ${{ matrix.registry-url == 'https://registry.npmjs.org' }}
        with:
          node-version: 24
          registry-url: ${{ matrix.registry-url }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
      - uses: actions/cache/restore@v6
        with:
          path: dist
          key: dist-${{ github.sha }}
      # Guard the workspace that is ACTUALLY published: if the dist cache restore
      # above did not populate dist/ (cache miss / cache service issue), fail here
      # instead of publishing a tarball without build output.
      - name: Verify build output ships in the npm tarball
        run: node .github/scripts/check-package-files.mjs
      - run: npm publish --registry ${{ matrix.registry-url }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ matrix.registry-url == 'https://npm.pkg.github.com' && secrets.GITHUB_TOKEN || secrets.NPMJS_TOKEN }}
