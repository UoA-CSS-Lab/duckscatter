services:
  app:
    hostname: duckscatter
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules
      - dist:/workspace/dist
      - react_node_modules:/workspace/examples/react/node_modules
    working_dir: /workspace

volumes:
  node_modules:
  dist:
  react_node_modules:
